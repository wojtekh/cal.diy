# cal.diy -- self-hosted Cal.com fork (MIT-licensed as of the calcom/cal.com ->
# calcom/cal.diy split, source: https://github.com/calcom/cal.diy).
# Deployed as its OWN Coolify project -- separate Postgres/Redis from the
# dograh stack (dograh-docker-compose-v3.yaml), no shared network. Trimmed
# from upstream's root docker-compose.yml: dropped the "studio" (Prisma
# Studio) service entirely -- upstream's own comment says to remove it in
# production to avoid exposing raw DB access publicly. If you ever need it
# for one-off debugging, run it manually with `docker compose run studio`
# rather than leaving it in the stack.
#
# BOTH services build from source -- as of this writing calcom/cal.diy has
# no published tags on Docker Hub at all yet (the repo only split off from
# calcom/cal.com recently; their image-publishing pipeline evidently isn't
# live), so `image: calcom.docker.scarf.sh/calcom/cal.diy` (what upstream's
# own docker-compose.yml references) fails to resolve. Confirmed via a real
# failed deploy: "failed to resolve reference
# ...calcom.docker.scarf.sh/calcom/cal.diy:latest: not found". Building from
# source is slower (full Next.js monorepo build) but is the only path that
# currently works -- revisit dropping back to prebuilt images once calcom/
# cal.diy actually has tags on Docker Hub.
#
# Companion files: cal-diy.env.example (fill in and set as Coolify's
# Environment Variables for this project), cal-diy-setup-guide.md (deploy
# steps + known gotchas + how this wires into survey-parser).

services:
  database:
    container_name: cal-diy-database
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caldiy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-calendso}
    volumes:
      - cal-diy-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caldiy}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    container_name: cal-diy-redis
    image: redis:7
    restart: unless-stopped
    command: --requirepass ${REDIS_PASSWORD}
    volumes:
      - cal-diy-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  calcom:
    container_name: cal-diy-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
        NEXT_PUBLIC_API_V2_URL: ${NEXT_PUBLIC_API_V2_URL}
        NEXT_PUBLIC_LICENSE_CONSENT: ${NEXT_PUBLIC_LICENSE_CONSENT:-1}
        NEXT_PUBLIC_WEBSITE_TERMS_URL: ${NEXT_PUBLIC_WEBSITE_TERMS_URL:-}
        NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL: ${NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL:-}
        NEXT_PUBLIC_SINGLE_ORG_SLUG: ${NEXT_PUBLIC_SINGLE_ORG_SLUG:-}
        ORGANIZATIONS_ENABLED: ${ORGANIZATIONS_ENABLED:-}
        CALCOM_TELEMETRY_DISABLED: ${CALCOM_TELEMETRY_DISABLED:-1}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
        DATABASE_URL: postgresql://${POSTGRES_USER:-caldiy}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-calendso}
        DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-caldiy}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-calendso}
        CSP_POLICY: ${CSP_POLICY:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-caldiy}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-calendso}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER:-caldiy}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-calendso}
    depends_on:
      database:
        condition: service_healthy

  calcom-api:
    container_name: cal-diy-api
    build:
      context: .
      dockerfile: apps/api/v2/Dockerfile
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-caldiy}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-calendso}
        DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-caldiy}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-calendso}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    env_file: .env
    environment:
      - NODE_ENV=production
      - API_PORT=${API_PORT:-8080}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-caldiy}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-calendso}
      - DATABASE_READ_URL=postgresql://${POSTGRES_USER:-caldiy}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-calendso}
      - DATABASE_WRITE_URL=postgresql://${POSTGRES_USER:-caldiy}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-calendso}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER:-caldiy}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-calendso}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_PREFIX=${API_KEY_PREFIX:-cal_}
      - WEB_APP_URL=${NEXT_PUBLIC_WEBAPP_URL}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  cal-diy-database-data:
  cal-diy-redis-data:
